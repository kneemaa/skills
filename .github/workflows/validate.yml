name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin, skills & links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate marketplace, plugins, skills, and links
        run: python3 .github/scripts/validate-plugin.py

  go:
    name: Go action helper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/lint-semantic-pull-request/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/actions/lint-semantic-pull-request/scripts/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
